[pytest]
pythonpath = .
testpaths = tests
markers =
    auth: kiểm đăng nhập, phân quyền
    crud: kiểm CRUD danh mục
    business: kiểm nghiệp vụ đặt xe
    backup: kiểm backup/restore
    nosql: kiểm đặc trưng NoSQL (LWT, MV, collection, guard)
    integration: cần Cassandra thật (keyspace _test)
