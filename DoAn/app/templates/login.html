{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-5">
      <h1 class="h4 mb-3">Đăng nhập</h1>
      {% if note %}<div class="alert alert-{{ note[0] }}">{{ note[1] }}</div>{% endif %}
      {% if form_error %}<div class="alert alert-danger">{{ form_error }}</div>{% endif %}
      <form method="post" action="/login" class="card card-body">
        <label class="form-label" for="username">Tên đăng nhập</label>
        <input class="form-control mb-2" id="username" name="username" value="{{ username }}" autocomplete="username" required>
        <label class="form-label" for="password">Mật khẩu</label>
        <input class="form-control mb-3" id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="btn btn-primary" type="submit">Đăng nhập</button>
      </form>
      <p class="mt-3">Chưa có tài khoản? <a href="/register">Đăng ký khách hàng</a></p>
    </div>
  </div>
{% endblock %}
