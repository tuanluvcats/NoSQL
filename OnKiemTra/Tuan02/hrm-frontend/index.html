<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Quản lý Nhân sự HRM</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body class="container py-4">
    <h2 class="mb-4">Hệ thống Quản lý Nhân viên</h2>

    <!-- Khu vực Tìm kiếm và Lọc -->
    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <input
          type="text"
          id="searchInput"
          class="form-control"
          placeholder="Tìm theo ID, Tên, Phòng ban..."
        />
      </div>
      <div class="col-md-2">
        <select id="statusFilter" class="form-select">
          <option value="">Trạng thái (Tất cả)</option>
          <option value="true">Đang làm việc</option>
          <option value="false">Đã nghỉ việc</option>
        </select>
      </div>
      <div class="col-md-4 d-flex gap-2">
        <input
          type="number"
          id="minSalary"
          class="form-control"
          placeholder="Lương Min"
        />
        <input
          type="number"
          id="maxSalary"
          class="form-control"
          placeholder="Lương Max"
        />
      </div>
      <div class="col-md-3">
        <button class="btn btn-primary w-100" onclick="applyFilters()">
          Lọc Dữ Liệu
        </button>
      </div>
    </div>

    <!-- Khu vực Danh sách và Hành động -->
    <div class="d-flex justify-content-between mb-2">
      <button class="btn btn-success" onclick="openFormModal()">
        + Thêm Nhân viên
      </button>
      <div>
        <button
          class="btn btn-outline-secondary btn-sm"
          onclick="fetchEmployees('asc')"
        >
          Lương Tăng Dần
        </button>
        <button
          class="btn btn-outline-secondary btn-sm"
          onclick="fetchEmployees('desc')"
        >
          Lương Giảm Dần
        </button>
      </div>
    </div>

    <table class="table table-hover table-bordered align-middle">
      <thead class="table-dark">
        <tr>
          <th>Mã NV</th>
          <th>Họ Tên</th>
          <th>Phòng Ban</th>
          <th>Lương</th>
          <th>Trạng thái</th>
          <th>Hành động</th>
        </tr>
      </thead>
      <tbody id="empTableBody"></tbody>
    </table>

    <!-- Modal Thêm / Sửa Nhân Viên -->
    <div class="modal fade" id="formModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle">Thông tin Nhân viên</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="dbId" />
            <div class="mb-3">
              <label>Mã NV</label>
              <input type="text" id="empId" class="form-control" required />
            </div>
            <div class="mb-3">
              <label>Họ Tên</label>
              <input type="text" id="empName" class="form-control" required />
            </div>
            <div class="mb-3">
              <label>Phòng Ban</label>
              <input type="text" id="empDept" class="form-control" required />
            </div>
            <div class="mb-3">
              <label>Lương</label>
              <input
                type="number"
                id="empSalary"
                class="form-control"
                required
              />
            </div>
            <div class="mb-3">
              <label>Trạng thái</label>
              <select id="empStatus" class="form-select">
                <option value="true">Đang làm việc</option>
                <option value="false">Đã nghỉ việc</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Hủy
            </button>
            <button class="btn btn-primary" onclick="saveEmployee()">
              Lưu Dữ Liệu
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Chi Tiết & Kỹ Năng -->
    <div class="modal fade" id="detailsModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-info text-white">
            <h5 class="modal-title">Hồ sơ Chi tiết</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div id="detailsContent" class="mb-3 text-dark"></div>
            <hr />
            <h6>Quản lý Kỹ năng (Skills)</h6>
            <div class="d-flex gap-2 mb-2">
              <input
                type="text"
                id="newSkill"
                class="form-control form-control-sm"
                placeholder="Nhập kỹ năng mới (vd: Java)"
              />
              <button class="btn btn-sm btn-success" onclick="addSkill()">
                Thêm
              </button>
            </div>
            <ul class="list-group" id="skillsList"></ul>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const API_BASE = "http://localhost:8080/api/employees";
      let employeesData = []; // Lưu cache dữ liệu để xử lý Frontend
      let currentEditingId = null; // Biến lưu ID đang xem/sửa chi tiết

      const formModal = new bootstrap.Modal(
        document.getElementById("formModal"),
      );
      const detailsModal = new bootstrap.Modal(
        document.getElementById("detailsModal"),
      );

      // 1. Tải danh sách
      async function fetchEmployees(sort = "") {
        let url = sort ? `${API_BASE}?sort=${sort}` : API_BASE;
        try {
          const res = await fetch(url);
          employeesData = await res.json();
          renderTable(employeesData);
        } catch (error) {
          Swal.fire("Lỗi!", "Không thể kết nối Backend", "error");
        }
      }

      // 2. Render bảng
      function renderTable(data) {
        const tbody = document.getElementById("empTableBody");
        tbody.innerHTML = data
          .map(
            (emp) => `
                <tr>
                    <td>${emp.employeeId || ""}</td>
                    <td><strong>${emp.fullName || ""}</strong></td>
                    <td>${emp.departmentCode || ""}</td>
                    <td>${emp.salary ? emp.salary.toLocaleString() + " đ" : ""}</td>
                    <td><span class="badge ${emp.active ? "bg-success" : "bg-danger"}">${emp.active ? "Đang làm" : "Đã nghỉ"}</span></td>
                    <td>
                        <button class="btn btn-sm btn-info text-white" onclick="viewDetails('${emp.id}')">Chi tiết</button>
                        <button class="btn btn-sm btn-warning" onclick="openFormModal('${emp.id}')">Sửa</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteEmp('${emp.id}')">Xóa</button>
                    </td>
                </tr>
            `,
          )
          .join("");
      }

      // 3. Xử lý Lọc Dữ Liệu
      function applyFilters() {
        const search = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const status = document.getElementById("statusFilter").value;
        const minSal = document.getElementById("minSalary").value;
        const maxSal = document.getElementById("maxSalary").value;

        let filtered = employeesData.filter((emp) => {
          let matchSearch =
            (emp.employeeId || "").toLowerCase().includes(search) ||
            (emp.fullName || "").toLowerCase().includes(search) ||
            (emp.departmentCode || "").toLowerCase().includes(search);
          let matchStatus = status === "" || String(emp.active) === status;
          let matchMin = !minSal || emp.salary >= Number(minSal);
          let matchMax = !maxSal || emp.salary <= Number(maxSal);
          return matchSearch && matchStatus && matchMin && matchMax;
        });
        renderTable(filtered);
      }

      // 4. Mở Modal Thêm/Sửa
      function openFormModal(id = null) {
        currentEditingId = id;
        if (id) {
          const emp = employeesData.find((e) => e.id === id);
          document.getElementById("modalTitle").innerText =
            "Cập nhật Nhân viên";
          document.getElementById("dbId").value = emp.id;
          document.getElementById("empId").value = emp.employeeId;
          document.getElementById("empName").value = emp.fullName;
          document.getElementById("empDept").value = emp.departmentCode;
          document.getElementById("empSalary").value = emp.salary;
          document.getElementById("empStatus").value = emp.active;
        } else {
          document.getElementById("modalTitle").innerText =
            "Thêm Nhân viên mới";
          document.getElementById("dbId").value = "";
          document.getElementById("empId").value = "";
          document.getElementById("empName").value = "";
          document.getElementById("empDept").value = "";
          document.getElementById("empSalary").value = "";
          document.getElementById("empStatus").value = "true";
        }
        formModal.show();
      }

      // 5. Lưu Nhân Viên (Gọi API POST/PUT)
      async function saveEmployee() {
        const payload = {
          employeeId: document.getElementById("empId").value,
          fullName: document.getElementById("empName").value,
          departmentCode: document.getElementById("empDept").value,
          salary: Number(document.getElementById("empSalary").value),
          active: document.getElementById("empStatus").value === "true",
          skills: currentEditingId
            ? employeesData.find((e) => e.id === currentEditingId).skills || []
            : [],
          address: currentEditingId
            ? employeesData.find((e) => e.id === currentEditingId).address || {}
            : {},
        };

        const method = currentEditingId ? "PUT" : "POST";
        const url = currentEditingId
          ? `${API_BASE}/${currentEditingId}`
          : API_BASE;

        try {
          await fetch(url, {
            method: method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          formModal.hide();
          Swal.fire("Thành công!", "Dữ liệu đã được lưu.", "success");
          fetchEmployees();
        } catch (err) {
          Swal.fire("Lỗi!", "Thao tác thất bại.", "error");
        }
      }

      // 6. Xóa Nhân Viên
      async function deleteEmp(id) {
        Swal.fire({
          title: "Xóa nhân viên?",
          text: "Dữ liệu sẽ không thể khôi phục!",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#d33",
          confirmButtonText: "Xóa ngay",
        }).then(async (result) => {
          if (result.isConfirmed) {
            await fetch(`${API_BASE}/${id}`, { method: "DELETE" });
            Swal.fire(
              "Đã xóa!",
              "Nhân viên đã bị xóa khỏi hệ thống.",
              "success",
            );
            fetchEmployees();
          }
        });
      }

      // 7. Xem Chi Tiết
      function viewDetails(id) {
        currentEditingId = id;
        const emp = employeesData.find((e) => e.id === id);
        const address = emp.address
          ? `${emp.address.street || ""}, ${emp.address.district || ""}, ${emp.address.city || ""}`
          : "Chưa cập nhật";

        document.getElementById("detailsContent").innerHTML = `
                <p><strong>Mã NV:</strong> ${emp.employeeId}</p>
                <p><strong>Họ tên:</strong> ${emp.fullName}</p>
                <p><strong>Phòng ban:</strong> ${emp.departmentCode}</p>
                <p><strong>Mức lương:</strong> ${emp.salary.toLocaleString()} VNĐ</p>
                <p><strong>Địa chỉ:</strong> ${address}</p>
            `;
        renderSkills(emp.skills || []);
        detailsModal.show();
      }

      // 8. Render mảng Kỹ năng
      function renderSkills(skills) {
        const list = document.getElementById("skillsList");
        if (skills.length === 0) {
          list.innerHTML = `<li class="list-group-item text-muted text-center">Chưa có kỹ năng nào</li>`;
          return;
        }
        list.innerHTML = skills
          .map(
            (skill) => `
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    ${skill}
                    <button class="btn btn-sm btn-danger py-0 px-2" onclick="removeSkill('${skill}')">x</button>
                </li>
            `,
          )
          .join("");
      }

      // 9. Thêm Kỹ năng
      async function addSkill() {
        const newSkill = document.getElementById("newSkill").value.trim();
        if (!newSkill) return;

        let emp = employeesData.find((e) => e.id === currentEditingId);
        if (!emp.skills) emp.skills = [];
        if (emp.skills.includes(newSkill)) {
          Swal.fire("Lưu ý", "Kỹ năng này đã tồn tại!", "info");
          return;
        }

        emp.skills.push(newSkill);

        await fetch(`${API_BASE}/${currentEditingId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(emp),
        });

        document.getElementById("newSkill").value = "";
        renderSkills(emp.skills);
        fetchEmployees(); // Cập nhật lại mảng global
      }

      // 10. Xóa Kỹ năng
      async function removeSkill(skillToRemove) {
        let emp = employeesData.find((e) => e.id === currentEditingId);
        emp.skills = emp.skills.filter((s) => s !== skillToRemove);

        await fetch(`${API_BASE}/${currentEditingId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(emp),
        });

        renderSkills(emp.skills);
        fetchEmployees();
      }

      window.onload = () => fetchEmployees();
    </script>
  </body>
</html>
