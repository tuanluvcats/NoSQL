# Do an NoSQL: Cassandra 3.11 cho keyspace ride_booking (bao cao) va ride_booking_demo (ung dung).
# Chi dung khi may khong cai Cassandra truc tiep.
#
# Khoi dong:              docker compose up -d cassandra-doan
# Xem trang thai:         docker compose ps
# Dung lai (giu du lieu): docker compose stop
# Xoa sach (mat du lieu): docker compose down -v

services:
  cassandra-doan:
    image: cassandra:3.11
    container_name: nosql-cassandra-doan
    restart: unless-stopped
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: NoSQLLab
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
      # cqlsh 5.x (Python 2) loi 'ascii codec' khi DESCRIBE/COPY ra file co tieng Viet neu thieu bien nay
      PYTHONIOENCODING: utf-8
    volumes:
      - cassandra-doan-data:/var/lib/cassandra
      - ./DoAn/cassandra:/doan
      - ./DoAn/cassandra/cqlshrc:/root/.cassandra/cqlshrc:ro

volumes:
  cassandra-doan-data:
